name: Data and site

on:
  schedule:
    # NHS England publishes RTT statistics on the second Thursday of each month.
    - cron: "17 7 15 * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "site/**"
      - "pyproject.toml"
      - ".github/workflows/data.yml"

permissions:
  contents: write

concurrency:
  group: data-and-site
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install .
      - name: Restore downloaded monthly files
        uses: actions/cache@v4
        with:
          path: .cache/rtt
          key: rtt-${{ github.run_id }}
          restore-keys: rtt-
      - name: Download, aggregate and check the data
        run: |
          set -o pipefail
          waitlens build --months 25 --out _site/data | tee build.log
      - name: Add the build log to the run summary
        if: always()
        run: |
          { echo '### WaitLens data build'; echo '```'; cat build.log 2>/dev/null; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - name: Assemble the site
        run: |
          cp site/index.html site/app.js site/styles.css site/favicon.svg _site/
          touch _site/.nojekyll
          du -sh _site _site/data
      - name: Publish to the gh-pages branch
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd _site
          git init -q -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          latest=$(python -c "import json; print(json.load(open('data/meta.json'))['latest'])")
          git commit -q -m "Site for ${GITHUB_SHA::7} with RTT data to ${latest}"
          git push -q --force "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" gh-pages
